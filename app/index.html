<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StatsMeister</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="brand-mark"></span>StatsMeister</div>
      <nav class="tabs">
        <button class="tab on" data-view="analysis" data-i18n="view.analysis"></button>
        <button class="tab" data-view="progress" data-i18n="view.progress"></button>
      </nav>
      <div class="rec">
        <select id="source">
          <option value="auto" data-i18n="source.auto"></option>
          <option value="ac">Assetto Corsa</option>
          <option value="acc">Assetto Corsa Competizione</option>
          <option value="demo" data-i18n="source.demo"></option>
        </select>
        <button id="rec-btn" class="btn btn-rec"><span class="dot"></span><span id="rec-label" data-i18n="app.record"></span></button>
        <span id="rec-status" class="rec-status"></span>
        <select id="lang" class="lang" title="Language / Язык">
          <option value="ru">RU</option>
          <option value="en">EN</option>
        </select>
      </div>
    </header>

    <aside class="sidebar">
      <section class="panel">
        <div class="panel-head">
          <h2 data-i18n="sessions.title"></h2>
          <div class="panel-actions">
            <button id="import" class="btn btn-ghost" data-i18n="sessions.import" data-i18n-title="sessions.importTitle"></button>
            <button id="refresh" class="btn btn-ghost" data-i18n-title="sessions.refresh">↻</button>
          </div>
        </div>
        <ul id="sessions" class="sessions"></ul>
      </section>
      <section class="panel laps-panel">
        <div class="panel-head">
          <h2 id="laps-title"></h2>
          <button id="export-session" class="btn btn-ghost" disabled>CSV</button>
        </div>
        <div class="laps-hint" data-i18n="laps.hint"></div>
        <table id="laps" class="laps"></table>
      </section>
    </aside>

    <main class="main">
      <div id="progress" class="progress" hidden></div>
      <div id="summary" class="summary"></div>
      <div id="coach" class="coach"></div>
      <div id="corners" class="corners"></div>
      <div id="charts" class="charts">
        <div class="empty" data-i18n="empty"></div>
      </div>
    </main>

    <aside class="inspector">
      <section class="panel" id="potential-panel" hidden>
        <h2 data-i18n="potential.title"></h2>
        <div id="potential"></div>
      </section>
      <section class="panel">
        <h2 data-i18n="track.title"></h2>
        <canvas id="map" class="map"></canvas>
        <div class="map-legend"><span class="gain" data-i18n="track.gain"></span><span class="loss" data-i18n="track.loss"></span></div>
      </section>
      <section class="panel">
        <h2 data-i18n="cursor.title"></h2>
        <table id="readout" class="readout"></table>
      </section>
      <section class="panel">
        <h2 data-i18n="stats.title"></h2>
        <table id="stats" class="readout"></table>
      </section>
    </aside>

    <div id="drop" class="drop"><div data-i18n="drop.hint"></div></div>
    <div id="toast" class="toast"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
