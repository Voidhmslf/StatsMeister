<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StatsMeister</title>
  </head>
  <body>
    <aside class="side">
      <div class="logo">StatsMeister</div>

      <div class="side-actions">
        <button id="rec-btn" class="btn btn-primary"><span class="rec-dot" aria-hidden="true"></span><span id="rec-label" data-i18n="app.record"></span></button>
        <label class="field field-inline">
          <span data-i18n="app.game"></span>
          <select id="source">
            <option value="auto" data-i18n="source.auto"></option>
            <option value="ac">Assetto Corsa</option>
            <option value="acc">ACC</option>
            <option value="demo" data-i18n="source.demo"></option>
          </select>
        </label>
        <p id="rec-status" class="rec-status" role="status" hidden></p>
        <button id="import" class="btn" data-i18n="app.import" data-i18n-title="app.importTitle"></button>
      </div>

      <nav id="sessions" class="sessions" aria-label="Sessions"></nav>

      <div class="side-foot">
        <select id="lang" aria-label="Language / Язык">
          <option value="ru">Русский</option>
          <option value="en">English</option>
        </select>
      </div>
    </aside>

    <main class="main">
      <section id="welcome" class="welcome" hidden>
        <h1 data-i18n="welcome.title"></h1>
        <p data-i18n="welcome.text"></p>
        <p data-i18n="welcome.replay"></p>
        <div class="welcome-actions">
          <button id="welcome-import" class="btn" data-i18n="app.import"></button>
          <button id="welcome-demo" class="btn btn-quiet" data-i18n="welcome.demo"></button>
        </div>
      </section>

      <section id="session" class="session-view" hidden>
        <header class="session-head">
          <div>
            <h1 id="s-title"></h1>
            <p id="s-meta" class="meta"></p>
          </div>
          <div id="s-best" class="s-best"></div>
        </header>
        <nav class="tabs" role="tablist">
          <button class="tab" role="tab" data-view="review" data-i18n="tab.review"></button>
          <button class="tab" role="tab" id="tab-telemetry" data-view="telemetry" data-i18n="tab.telemetry"></button>
          <button class="tab" role="tab" id="tab-progress" data-view="progress" data-i18n="tab.progress"></button>
        </nav>

        <div id="view-review" class="view review" role="tabpanel">
          <div id="review-body" class="review-body"></div>
          <aside class="review-side">
            <canvas id="review-map" class="map"></canvas>
          </aside>
        </div>

        <div id="view-telemetry" class="view telemetry" role="tabpanel" hidden>
          <div id="tele-head" class="tele-head"></div>
          <div class="tele-grid">
            <div class="tele-main">
              <div id="corners" class="corners"></div>
              <div id="charts" class="charts"></div>
            </div>
            <aside class="tele-side">
              <canvas id="tele-map" class="map"></canvas>
              <div id="readout"></div>
              <div id="tele-potential"></div>
              <div id="tele-stats"></div>
            </aside>
          </div>
        </div>

        <div id="view-progress" class="view progress" role="tabpanel" hidden></div>
      </section>
    </main>

    <div id="drop" class="drop"><p data-i18n="drop.hint"></p></div>
    <div id="toast" class="toast" role="alert"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
